# Разово (або коли треба оновити) забирає код тестового сайту з хостингу в це сховище.
# Запуск: Actions → «Забрати код з хостингу» → Run workflow.
name: Забрати код з хостингу
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Встановити lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Завантажити файли з хостингу (без картинок, кешу і конфігів з паролями)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Лише код і дизайн: файли в корені + папки catalog, admin, system.
          # Картинки, кеш, бібліотеки vendor і конфіги з паролями не беремо — вони лишаються на хостингу.
          EX="-x '(^|/)config\\.php\$' -x '\\.(zip|tar|gz|tgz|rar|7z|sql|log)\$' -x '(^|/)cachewebp/' -x '(^|/)node_modules/'"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30;
            mirror --no-recursion --verbose=1 $EX / ./ ;
            mirror --parallel=10 --verbose=1 $EX /catalog ./catalog ;
            mirror --parallel=10 --verbose=1 $EX /admin ./admin ;
            mirror --parallel=10 --verbose=1 $EX -x '^storage/' /system ./system ;
            quit"
          rm -f config.php admin/config.php
          echo "Файлів: $(find . -path ./.git -prune -o -type f -print | wc -l)"; du -sh --exclude=.git .
      - name: Пропустити файли більші за 90 МБ (GitHub їх не приймає)
        run: |
          find . -path ./.git -prune -o -type f -size +90M -print | sed 's#^\./##' | tee -a .gitignore
      - name: Зберегти в сховище
        run: |
          git config user.name "getvape-test bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Імпорт коду з хостингу getvape.vapors.app" || echo "Змін немає"
          git push
